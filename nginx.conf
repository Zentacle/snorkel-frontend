
#user  nobody;
worker_processes  1;

error_log  /root/nginx-error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 80;

        server_name _;

        return 301 https://$host$request_uri;
    }

    server {
        listen              443 ssl;
        server_name         shorediving.com;

        ssl_certificate      shorediving.com_ssl_certificate.cer;
        ssl_certificate_key  _.shorediving.com_private_key.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;

        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        return 301          https://www.shorediving.com$request_uri;
    }

    # HTTPS server
    
    server {
       listen       443 ssl default_server;
       server_name  www.shorediving.com;

       ssl_certificate      shorediving.com_ssl_certificate.cer;
       ssl_certificate_key  _.shorediving.com_private_key.key;

       ssl_session_cache    shared:SSL:1m;
       ssl_session_timeout  5m;

       ssl_ciphers  HIGH:!aNULL:!MD5;
       ssl_prefer_server_ciphers  on;

       # Pages that moved to zentacle.com are 301'd (not proxied) so search
       # engines consolidate shorediving.com's links onto the zentacle.com URL
       # instead of seeing a duplicate copy on this domain.
